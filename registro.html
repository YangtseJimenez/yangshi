<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Don Pollo | Registro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #fffaf2;
        --panel: #fff;
        --primary: #d72638;
        --primary-dark: #b31222;
        --secondary: #f7c948;
        --secondary-dark: #d69f1d;
        --text: #151515;
        --muted: #5a5a5a;
        --line: #f0e4c5;
        --success: #1f9d75;
        --warning: #ffefbf;
        --shadow: 0 30px 60px rgba(14, 14, 14, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fff7db 0%, #fffbf0 100%);
        color: var(--text);
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .top-nav {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: min(980px, calc(100% - 32px));
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        z-index: 20;
      }

      .top-nav a {
        background: rgba(17,17,17,0.88);
        color: white;
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 800;
        font-size: 0.9rem;
        text-decoration: none;
        box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      }

      .login-shell {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        background: rgba(255,255,255,0.92);
        border: 1px solid var(--line);
        border-radius: 32px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .brand-panel {
        background: linear-gradient(160deg, #181818 0%, #2a2a2a 100%);
        color: white;
        padding: 40px 32px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
        position: relative;
      }

      .brand-panel::before {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(247, 201, 72, 0.08);
        right: -60px;
        top: -40px;
      }

      .brand-top {
        position: relative;
        z-index: 1;
      }

      .brand-tag {
        display: inline-block;
        background: rgba(247, 201, 72, 0.15);
        color: var(--secondary);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand-panel h1 {
        margin: 8px 0 10px;
        font-size: clamp(2.3rem, 4vw, 4rem);
        line-height: 0.95;
        position: relative;
        z-index: 1;
      }

      .brand-panel h1 span {
        color: var(--secondary);
      }

      .brand-panel p {
        margin: 0;
        color: #dedede;
        font-size: 1.04rem;
        line-height: 1.7;
        max-width: 420px;
        position: relative;
        z-index: 1;
      }

      .brand-feature {
        display: grid;
        grid-template-columns: repeat(3, minmax(90px, 1fr));
        gap: 14px;
        margin-top: 12px;
        position: relative;
        z-index: 1;
      }

      .feature-box {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 16px 12px;
        text-align: center;
      }

      .feature-box strong {
        display: block;
        font-size: 1.5rem;
        color: var(--secondary);
      }

      .feature-box span {
        font-size: 0.78rem;
        color: #ddd;
      }

      .form-panel {
        padding: 38px 28px;
        background: #fffdf9;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .form-box {
        width: min(100%, 440px);
      }

      .form-box h2 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .form-box p {
        margin: 0 0 28px;
        color: var(--muted);
      }

      .input-group {
        position: relative;
        margin-bottom: 18px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        color: var(--text);
      }

      .input-group input {
        width: 100%;
        height: 52px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: white;
        padding: 0 16px;
        font-size: 1rem;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .input-group input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(215, 38, 56, 0.1);
      }

      .submit-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        font-size: 1rem;
        font-weight: 900;
        height: 54px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 16px 24px rgba(215, 38, 56, 0.25);
      }

      .submit-btn:hover {
        transform: translateY(-1px);
      }

      .login-line {
        margin-top: 20px;
        text-align: center;
        color: var(--muted);
        font-size: 0.93rem;
      }

      .login-line a {
        color: var(--primary);
        font-weight: 800;
        text-decoration: none;
      }

      .status {
        margin-top: 18px;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.95rem;
        display: none;
      }

      .status.show {
        display: block;
      }

      .status.error {
        background: #fff1f4;
        color: #9d1b2d;
        border: 1px solid #f9c7d1;
      }

      .status.success {
        background: #ebfff7;
        color: #0d7a54;
        border: 1px solid #bfead7;
      }

      @media (max-width: 860px) {
        .login-shell {
          grid-template-columns: 1fr;
        }

        .brand-panel {
          padding-bottom: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="top-nav">
      <a href="index.html">Inicio</a>
      <a href="menu.html">Menú</a>
      <a href="login.html">Login</a>
    </div>

    <div class="page">
      <div class="login-shell">
        <aside class="brand-panel">
          <div class="brand-top">
            <span class="brand-tag">Don Pollo</span>
            <h1>Únete y <span>disfruta más.</span></h1>
          </div>

          <p>
            Crea tu cuenta para guardar tus pedidos, recibir promociones exclusivas y disfrutar de una experiencia más rápida.
          </p>

          <div class="brand-feature">
            <div class="feature-box">
              <strong>15m</strong>
              <span>entrega</span>
            </div>
            <div class="feature-box">
              <strong>4.9★</strong>
              <span>rating</span>
            </div>
            <div class="feature-box">
              <strong>25K</strong>
              <span>clientes</span>
            </div>
          </div>
        </aside>

        <main class="form-panel">
          <div class="form-box">
            <h2>Crear cuenta</h2>
            <p>Regístrate para empezar a pedir.</p>

            <form id="registerForm">
              <div class="input-group">
                <label for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" required />
              </div>

              <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" placeholder="tucorreo@ejemplo.com" required />
              </div>

              <div class="input-group">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required />
              </div>

              <div class="input-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••" required />
              </div>

              <button class="submit-btn" type="submit">Registrarse</button>
            </form>

            <div class="login-line">
              ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>

            <div id="status" class="status" aria-live="polite"></div>
          </div>
        </main>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://rqhdhaxynisxspdbfavr.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_bt3gDUOUZck2-YlyPUxntQ_7blm642d";

      const form = document.getElementById("registerForm");
      const statusEl = document.getElementById("status");

      function showStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = `status show ${type}`;
      }

      function getSupabaseClient() {
        if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
          return null;
        }

        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const nombre = document.getElementById("nombre").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();

        if (!nombre || !email || !password) {
          showStatus("Completa todos los campos.", "error");
          return;
        }

        if (password.length < 6) {
          showStatus("La contraseña debe tener al menos 6 caracteres.", "error");
          return;
        }

        if (password !== confirmPassword) {
          showStatus("Las contraseñas no coinciden.", "error");
          return;
        }

        const supabase = getSupabaseClient();

        if (!supabase) {
          showStatus("Falta la clave anónima de Supabase. Pégala en SUPABASE_ANON_KEY.", "error");
          return;
        }

        showStatus("Registrando usuario...", "success");

        try {
          const { data: authData, error: authError } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: nombre,
              }
            }
          });

          if (authError) throw authError;

          const message = authData.session
            ? "Registro exitoso. Ya puedes iniciar sesión."
            : "Cuenta creada. Revisa tu correo para confirmar la cuenta.";
          showStatus(message, "success");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } catch (error) {
          showStatus(error.message || "No se pudo registrar al usuario.", "error");
        }
      });
    </script>
  </body>
</html>
